<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe — Neon Edition</title>
  <style>
    /* =========================================================
       CSS Custom Properties (Design Tokens)
       ========================================================= */
    :root {
      /* Color palette */
      --bg-body:        #0d0d0d;
      --bg-surface:     #141414;
      --bg-cell:        #1a1a2e;
      --bg-cell-hover:  #16213e;

      --color-x:        #00f0ff;   /* cyan  — Player X */
      --color-x-glow:   #00f0ff88;
      --color-o:        #ff00aa;   /* magenta — Player O */
      --color-o-glow:   #ff00aa88;
      --color-win:      #ffe600;   /* gold highlight for winning cells */
      --color-win-glow: #ffe60088;

      --color-text:     #e0e0e0;
      --color-muted:    #555577;
      --color-border:   #2a2a4a;

      --font-main:      'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono:      'Courier New', Courier, monospace;

      /* Spacing */
      --gap:            clamp(6px, 1.5vw, 12px);
      --cell-size:      clamp(80px, 18vw, 140px);
      --radius:         8px;
    }

    /* =========================================================
       Reset & Base
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      background-color: var(--bg-body);
      color: var(--color-text);
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* =========================================================
       Page Wrapper
       ========================================================= */
    .page-wrapper {
      width: 100%;
      max-width: 600px;
      padding: 1.5rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* =========================================================
       Header / Logo
       ========================================================= */
    .site-header {
      width: 100%;
      text-align: center;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: clamp(1.6rem, 6vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--color-text);
      user-select: none;
    }

    .logo .x-color {
      color: var(--color-x);
      text-shadow: 0 0 10px var(--color-x-glow), 0 0 20px var(--color-x-glow);
    }

    .logo .o-color {
      color: var(--color-o);
      text-shadow: 0 0 10px var(--color-o-glow), 0 0 20px var(--color-o-glow);
    }

    /* =========================================================
       Game Container
       ========================================================= */
    .game-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    /* =========================================================
       Turn Indicator
       ========================================================= */
    .turn-indicator {
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background-color: var(--bg-surface);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .turn-indicator.is-x {
      border-color: var(--color-x);
      box-shadow: 0 0 8px var(--color-x-glow);
    }

    .turn-indicator.is-o {
      border-color: var(--color-o);
      box-shadow: 0 0 8px var(--color-o-glow);
    }

    .player-symbol {
      font-weight: 900;
    }

    .turn-indicator.is-x .player-symbol {
      color: var(--color-x);
      text-shadow: 0 0 8px var(--color-x-glow);
    }

    .turn-indicator.is-o .player-symbol {
      color: var(--color-o);
      text-shadow: 0 0 8px var(--color-o-glow);
    }

    /* =========================================================
       Board (3×3 Grid)
       ========================================================= */
    .board {
      display: grid;
      grid-template-columns: repeat(3, var(--cell-size));
      grid-template-rows: repeat(3, var(--cell-size));
      gap: var(--gap);
    }

    /* =========================================================
       Cell
       ========================================================= */
    .cell {
      width:  var(--cell-size);
      height: var(--cell-size);
      background-color: var(--bg-cell);
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 900;
      transition: background-color 0.15s ease, border-color 0.15s ease,
                  box-shadow 0.15s ease, transform 0.1s ease;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    /* Hover state for empty cells */
    .cell:not(.taken):hover {
      background-color: var(--bg-cell-hover);
      border-color: var(--color-muted);
      transform: scale(1.04);
    }

    /* Focus ring for keyboard navigation */
    .cell:focus-visible {
      border-color: var(--color-x);
      box-shadow: 0 0 0 3px var(--color-x-glow);
    }

    /* Taken cells are not clickable-looking */
    .cell.taken {
      cursor: default;
    }

    /* =========================================================
       X Piece
       ========================================================= */
    .cell.x-piece {
      color: var(--color-x);
      border-color: var(--color-x);
      text-shadow: 0 0 10px var(--color-x-glow), 0 0 20px var(--color-x-glow);
      box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.08);
    }

    .cell.x-piece::after {
      content: '✕';
    }

    /* =========================================================
       O Piece
       ========================================================= */
    .cell.o-piece {
      color: var(--color-o);
      border-color: var(--color-o);
      text-shadow: 0 0 10px var(--color-o-glow), 0 0 20px var(--color-o-glow);
      box-shadow: inset 0 0 20px rgba(255, 0, 170, 0.08);
    }

    .cell.o-piece::after {
      content: '○';
    }

    /* =========================================================
       Winning Cell
       ========================================================= */
    .cell.winning {
      border-color: var(--color-win);
      text-shadow: 0 0 12px var(--color-win-glow), 0 0 24px var(--color-win-glow);
      box-shadow: inset 0 0 24px rgba(255, 230, 0, 0.18),
                  0 0 12px var(--color-win-glow);
      animation: winning-pulse 1s ease-in-out infinite alternate;
    }

    @keyframes winning-pulse {
      from { box-shadow: inset 0 0 24px rgba(255,230,0,0.18), 0 0 8px var(--color-win-glow); }
      to   { box-shadow: inset 0 0 40px rgba(255,230,0,0.30), 0 0 20px var(--color-win-glow); }
    }

    /* =========================================================
       Status Message (aria-live region)
       ========================================================= */
    .status-message {
      min-height: 1.6rem;
      font-size: clamp(0.9rem, 3vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-align: center;
      color: var(--color-win);
      text-shadow: 0 0 8px var(--color-win-glow);
      transition: opacity 0.25s ease;
    }

    /* =========================================================
       Controls (New Game / Reset Score)
       ========================================================= */
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 0.55rem 1.4rem;
      border-radius: 999px;
      border: 2px solid transparent;
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease,
                  box-shadow 0.15s ease, transform 0.1s ease;
      outline: none;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 3px var(--color-x-glow);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: var(--color-x);
      color: #000;
      border-color: var(--color-x);
    }

    .btn-primary:hover {
      background-color: transparent;
      color: var(--color-x);
      box-shadow: 0 0 10px var(--color-x-glow);
    }

    .btn-ghost {
      background-color: transparent;
      color: var(--color-muted);
      border-color: var(--color-border);
    }

    .btn-ghost:hover {
      color: var(--color-text);
      border-color: var(--color-muted);
    }

    /* =========================================================
       Scoreboard
       ========================================================= */
    .scoreboard {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .score-card {
      flex: 1;
      min-width: 90px;
      max-width: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      padding: 0.75rem 0.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background-color: var(--bg-surface);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .score-card.score-x {
      border-color: transparent;
    }

    .score-card.score-x.active-player {
      border-color: var(--color-x);
      box-shadow: 0 0 10px var(--color-x-glow);
    }

    .score-card.score-o {
      border-color: transparent;
    }

    .score-card.score-o.active-player {
      border-color: var(--color-o);
      box-shadow: 0 0 10px var(--color-o-glow);
    }

    .score-card.score-draw {
      border-color: transparent;
    }

    .score-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    .score-card.score-x .score-label {
      color: var(--color-x);
    }

    .score-card.score-o .score-label {
      color: var(--color-o);
    }

    .score-value {
      font-family: var(--font-mono);
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 900;
      line-height: 1;
    }

    .score-card.score-x .score-value {
      color: var(--color-x);
      text-shadow: 0 0 8px var(--color-x-glow);
    }

    .score-card.score-o .score-value {
      color: var(--color-o);
      text-shadow: 0 0 8px var(--color-o-glow);
    }

    .score-card.score-draw .score-value {
      color: var(--color-text);
    }

    /* =========================================================
       Responsive Tweaks
       ========================================================= */
    @media (max-width: 360px) {
      .page-wrapper {
        padding: 1rem 0.5rem 2rem;
        gap: 1rem;
      }
    }

    @media (min-width: 768px) {
      .page-wrapper {
        padding: 2.5rem 1.5rem 4rem;
        gap: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <!-- =============================================
         Header / Logo
         ============================================= -->
    <header class="site-header">
      <h1 class="logo">TIC<span class="x-color">✕</span>TAC<span class="o-color">○</span>TOE</h1>
    </header>

    <!-- =============================================
         Main Game Area
         ============================================= -->
    <main class="game-container">

      <!-- Turn Indicator (aria-live) -->
      <div class="turn-indicator is-x"
           id="turnIndicator"
           aria-live="polite"
           aria-atomic="true">
        Player <span class="player-symbol" id="currentPlayerSymbol">X</span>'s turn
      </div>

      <!-- 3×3 Board -->
      <div class="board"
           id="board"
           role="grid"
           aria-label="Tic Tac Toe Board">
        <div class="cell" data-index="0" role="gridcell" tabindex="0" aria-label="Cell 1, empty"></div>
        <div class="cell" data-index="1" role="gridcell" tabindex="0" aria-label="Cell 2, empty"></div>
        <div class="cell" data-index="2" role="gridcell" tabindex="0" aria-label="Cell 3, empty"></div>
        <div class="cell" data-index="3" role="gridcell" tabindex="0" aria-label="Cell 4, empty"></div>
        <div class="cell" data-index="4" role="gridcell" tabindex="0" aria-label="Cell 5, empty"></div>
        <div class="cell" data-index="5" role="gridcell" tabindex="0" aria-label="Cell 6, empty"></div>
        <div class="cell" data-index="6" role="gridcell" tabindex="0" aria-label="Cell 7, empty"></div>
        <div class="cell" data-index="7" role="gridcell" tabindex="0" aria-label="Cell 8, empty"></div>
        <div class="cell" data-index="8" role="gridcell" tabindex="0" aria-label="Cell 9, empty"></div>
      </div>

      <!-- Status Message (aria-live) -->
      <div class="status-message"
           id="statusMessage"
           role="status"
           aria-live="polite"
           aria-atomic="true"></div>

      <!-- Control Buttons -->
      <div class="controls">
        <button class="btn btn-primary" id="newGameBtn" type="button">New Game</button>
        <button class="btn btn-ghost"   id="resetScoreBtn" type="button">Reset Score</button>
      </div>

      <!-- Scoreboard -->
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score-card score-x active-player" id="scoreCardX">
          <span class="score-label">Player X</span>
          <span class="score-value" id="scoreX">0</span>
        </div>
        <div class="score-card score-draw" id="scoreCardDraw">
          <span class="score-label">Draws</span>
          <span class="score-value" id="scoreDraw">0</span>
        </div>
        <div class="score-card score-o" id="scoreCardO">
          <span class="score-label">Player O</span>
          <span class="score-value" id="scoreO">0</span>
        </div>
      </div>

    </main><!-- /.game-container -->
  </div><!-- /.page-wrapper -->

  <!-- Game logic — served as a separate file for testability -->
  <script src="game.js"></script>
</body>
</html>
